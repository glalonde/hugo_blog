{{- /* len counts UTF-8 bytes; use decimal kilobytes of rendered article text. */ -}}
{{- $kilobytes := div (float (len .Plain)) 1000 -}}
<span class="text-size" title="Article text size, excluding images" aria-label="{{ printf "%.1f kilobytes of article text" $kilobytes }}">{{ printf "%.1f kB" $kilobytes }}</span>
