name: github pages

on:
  push:
    branches:
      - master  # Set a branch to deploy
  pull_request:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Check theme
        run: python3 themes/cinnastyx/tests/test_build.py

      - name: Cache processed images
        uses: actions/cache@v5
        with:
          path: resources/_gen/images
          key: ${{ runner.os }}-hugo-images-${{ hashFiles('.hugo-version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hugo-images-${{ hashFiles('.hugo-version') }}-

      - name: Build
        run: hugo --minify --panicOnWarning

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: glalon.de
