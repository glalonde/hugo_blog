title = "glalonde"
theme = "cinnastyx"
copyright = ""

baseURL = "https://glalon.de/"
locale = "en-US"
enableRobotsTXT = true

[params]
  scheme = "dark" # light, dark, gray or preference
  description = "Reporting Live"
  logo = "mvq.jpg"

[menu]
  [[menu.main]]
    name = "Feed"
    url = "/index.xml"
  [[menu.main]]
    name = "About"
    url = "/about"

[pagination]
  pagerSize = 20

[markup.highlight]
  style = "solarized-dark"

# Content in this repository is trusted and includes HTML examples.
[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["\\[", "\\]"], ["$$", "$$"]]
    inline = [["\\(", "\\)"]]
